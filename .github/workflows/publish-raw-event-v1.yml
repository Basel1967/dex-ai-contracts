name: publish-raw-event-v1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-raw-event-v1.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9b9f62442d12f5a949897075db855bee7bc9c100
      - name: Verify immutable artifact digests
        run: |
          echo "b0d5b5215d7c5a4dfd4e950655f671cac2628ef627d2a2062b9081cdfa40cd48  releases/out/raw-event-v1.0.0.tar.gz" | sha256sum --check -
          echo "3bb89e3665261703dc22e94808d6c5e9bed114c29c66fdbd37904e01d98f4120  releases/out/event-envelope-v1.0.0.tar.gz" | sha256sum --check -
      - name: Create official tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create raw-event-v1.0.0 releases/out/raw-event-v1.0.0.tar.gz --target 9b9f62442d12f5a949897075db855bee7bc9c100 --title "Raw Event v1.0.0" --notes-file reports/session23-final-report.md --latest
