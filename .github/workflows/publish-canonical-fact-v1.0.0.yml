name: Publish Canonical Fact v1.0.0
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-canonical-fact-v1.0.0.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable package
        shell: bash
        run: |
          echo "136ba904fd0819422c7926613a0d76a9475f6928096a7945ef11322b92bea2e0  releases/out/canonical-fact-v1.0.0-foundation-candidate.tar.gz" | sha256sum -c -
          test "$(git rev-parse f324814c2d84d1881a8b583fa86375a27cfb3d0e)" = "f324814c2d84d1881a8b583fa86375a27cfb3d0e"
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create canonical-fact-v1.0.0             releases/out/canonical-fact-v1.0.0-foundation-candidate.tar.gz             --repo "${{ github.repository }}"             --target f324814c2d84d1881a8b583fa86375a27cfb3d0e             --title "Canonical Fact v1.0.0"             --notes "Canonical Fact v1.0.0 — Foundation Vertical Slice. Entity type: SOLANA_MINT. Fact type: MINT_INITIALIZED. No agents or services."
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-canonical-fact-v1.0.0.yml
          git commit -m "chore: remove temporary Canonical Fact release workflow"
          git push origin HEAD:main
